<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 電流急急棒</title>
<style>
  :root{
    --bg:#070b16; --bg2:#0d1530; --neon:#19e0ff; --neon2:#7b5cff;
    --green:#39ff9e; --red:#ff3b5c; --gold:#ffd23f; --ink:#cfe6ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:radial-gradient(120% 120% at 50% -10%, #15214a 0%, var(--bg) 60%);
    color:var(--ink); font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    overflow-x:hidden; user-select:none;
  }
  h1{font-size:clamp(20px,5vw,32px); margin:14px 0 2px; letter-spacing:2px;
     text-shadow:0 0 12px var(--neon),0 0 26px var(--neon2);}
  .sub{font-size:12px; opacity:.6; margin-bottom:8px;}

  #hud{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
       margin-bottom:8px; width:96%; max-width:1000px;}
  .stat{background:rgba(20,30,60,.6); border:1px solid rgba(80,140,255,.3);
        border-radius:10px; padding:6px 12px; font-size:14px; min-width:84px; text-align:center;}
  .stat b{display:block; font-size:18px; color:#fff; text-shadow:0 0 8px var(--neon);}
  .stat span{font-size:11px; opacity:.65;}

  #stage{position:relative; width:96%; max-width:1000px; aspect-ratio:1000/620;
         border-radius:14px; overflow:hidden;
         box-shadow:0 0 0 1px rgba(90,150,255,.25), 0 10px 40px rgba(0,0,0,.6),
                    inset 0 0 60px rgba(20,40,90,.5);}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

  #overlay{position:absolute; inset:0; display:flex; flex-direction:column;
           align-items:center; justify-content:center; text-align:center;
           background:rgba(5,10,22,.82); backdrop-filter:blur(4px); padding:16px; gap:8px;}
  #overlay.hidden{display:none;}
  #overlay h2{margin:0; font-size:clamp(22px,6vw,40px);
              text-shadow:0 0 18px currentColor;}
  #overlay p{margin:2px; font-size:14px; opacity:.85;}
  .btn{margin-top:8px; cursor:pointer; border:none; border-radius:12px;
       padding:12px 26px; font-size:16px; font-weight:700; color:#031019;
       background:linear-gradient(180deg,var(--neon),#0bb9e0);
       box-shadow:0 0 20px rgba(25,224,255,.6); letter-spacing:1px;}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:transparent; color:var(--ink);
             border:1px solid rgba(120,160,255,.4); box-shadow:none;}

  /* cover / title screen */
  #cover{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:8px; text-align:center;
         background:radial-gradient(circle at 50% 42%, rgba(7,11,22,.5), rgba(7,11,22,.86));}
  #cover.hidden{display:none;}
  .cv-title{font-size:clamp(34px,9vw,74px); font-weight:900; letter-spacing:5px; color:#fff;
            animation:cvpulse 2s ease-in-out infinite;}
  @keyframes cvpulse{0%,100%{text-shadow:0 0 16px var(--neon),0 0 40px var(--neon2);}
                     50%{text-shadow:0 0 30px var(--neon),0 0 74px var(--neon2);}}
  .cv-sub{font-size:clamp(13px,3vw,18px); opacity:.85; letter-spacing:2px;}
  .cv-btn{margin-top:12px; font-size:18px; padding:14px 36px; animation:cvbtn 1.6s ease-in-out infinite;}
  @keyframes cvbtn{0%,100%{box-shadow:0 0 18px rgba(25,224,255,.55);}
                   50%{box-shadow:0 0 38px rgba(25,224,255,1);}}
  .cv-demo{font-size:12px; opacity:.5; margin-top:8px; letter-spacing:1px;}

  #levels{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
          margin:12px 0 30px; width:96%; max-width:1000px;}
  .lv{width:46px; height:46px; border-radius:10px; cursor:pointer; font-weight:700;
      background:rgba(20,30,60,.6); border:1px solid rgba(90,150,255,.3); color:var(--ink);
      display:flex; align-items:center; justify-content:center; font-size:16px; position:relative;}
  .lv.cur{border-color:var(--neon); box-shadow:0 0 14px var(--neon); color:#fff;}
  .lv.done{color:var(--green); border-color:rgba(57,255,158,.5);}
  .lv.locked{opacity:.35; cursor:not-allowed;}
  .lv small{position:absolute; bottom:-16px; font-size:9px; opacity:.6; white-space:nowrap;}
  .hint{font-size:12px; opacity:.55; margin:4px 0 0; text-align:center;}

  /* control bar */
  #controls{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;}
  .tog{cursor:pointer; border:1px solid rgba(120,160,255,.4); background:rgba(20,30,60,.6);
       color:var(--ink); border-radius:20px; padding:7px 16px; font-size:13px; font-weight:600;}
  .tog.on{background:linear-gradient(180deg,var(--neon),#0bb9e0); color:#031019; border-color:transparent;
          box-shadow:0 0 14px rgba(25,224,255,.5);}
  .tog:active{transform:scale(.96);}

  /* quiz in overlay */
  #ovQuiz{display:flex; flex-direction:column; gap:8px; width:100%; max-width:420px;}
  #ovQuiz .q{font-size:16px; font-weight:600; color:#fff; margin-bottom:2px;}
  #ovQuiz .opt{cursor:pointer; border:1px solid rgba(120,160,255,.4); background:rgba(20,30,60,.7);
       color:var(--ink); border-radius:10px; padding:10px 14px; font-size:15px; text-align:left;}
  #ovQuiz .opt.right{background:rgba(57,255,158,.25); border-color:var(--green); color:#fff;}
  #ovQuiz .opt.wrong{background:rgba(255,59,92,.25); border-color:var(--red);}
  #ovQuiz .exp{font-size:13px; opacity:.85; line-height:1.5; min-height:1px;}

  /* interactive circuit lab */
  #edu{display:none; width:96%; max-width:1000px; margin-top:12px;
       background:rgba(13,21,48,.6); border:1px solid rgba(90,150,255,.25); border-radius:14px; padding:16px;}
  #edu.show{display:block;}
  .lab-title{font-size:16px; font-weight:700; color:var(--neon); text-align:center; margin-bottom:6px;}
  .lab-sub{font-size:12px; opacity:.6; text-align:center; margin-bottom:10px;}
  #lab{width:100%; max-width:580px; height:auto; display:block; margin:0 auto;}
  #lab .wire{stroke:#5a72b8; stroke-width:5; fill:none; stroke-linecap:round;}
  #lab .flow{stroke:var(--neon); stroke-width:5; fill:none; stroke-dasharray:10 14; opacity:0;}
  #lab.closed .flow{opacity:1; animation:flow .5s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-24;}}
  #lab text{fill:var(--ink); font-family:system-ui; font-size:13px;}
  #lab .clickable{cursor:pointer;}
  #bulbGlass{fill:rgba(255,210,60,.08); stroke:#5a72b8; stroke-width:3; transition:fill .15s;}
  #lab.lit #bulbGlass{fill:var(--gold); stroke:var(--gold); filter:drop-shadow(0 0 16px var(--gold));}
  #bulbFil{stroke:#6b7aa8; stroke-width:2.5; fill:none;}
  #lab.lit #bulbFil{stroke:#9a4a0a;}
  #buzzBody{fill:#22304f; stroke:#5a72b8; stroke-width:3; transition:fill .15s;}
  #lab.lit #buzzBody{fill:var(--red); stroke:var(--red); filter:drop-shadow(0 0 12px var(--red));}
  #buzzWaves{opacity:0;}
  #lab.lit #buzzWaves{opacity:1; animation:bw .55s ease-out infinite;}
  @keyframes bw{0%{opacity:.1;}50%{opacity:.95;}100%{opacity:.1;}}
  .swdot{fill:#5a72b8;}
  #swLever{stroke:var(--ink); stroke-width:5; stroke-linecap:round;}
  #lab.closed #swLever{stroke:var(--neon);}
  #labStatus{text-align:center; margin:14px 0 4px;}
  #labBadge{font-size:20px; font-weight:800; padding:7px 16px; border-radius:10px; display:inline-block;}
  #labBadge.on{color:#031019; background:var(--neon); box-shadow:0 0 14px rgba(25,224,255,.5);}
  #labBadge.off{color:var(--ink); background:rgba(120,160,255,.12); border:1px solid rgba(120,160,255,.4);}
  #labWhy{display:block; font-size:13.5px; opacity:.9; margin-top:8px; line-height:1.6; min-height:1.6em;}
  .lab-controls{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin-top:12px;}
  .ctrl-group{text-align:center;}
  .ctrl-label{font-size:12px; opacity:.6; margin-bottom:6px;}
  .chip{cursor:pointer; border:1px solid rgba(120,160,255,.4); background:rgba(20,30,60,.7); color:var(--ink);
        border-radius:18px; padding:8px 14px; font-size:13px; margin:3px;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--neon); color:#031019; border-color:transparent; box-shadow:0 0 12px rgba(25,224,255,.5);}
  .chip.cond{border-color:rgba(57,255,158,.55);}
  .chip.ins{border-color:rgba(255,160,60,.55);}
  #matChips{max-width:540px;}
</style>

<body>

<script>
(()=>{
const W=1000, H=620;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1, 2);
cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);

// offscreen layers
const trackCv=document.createElement('canvas'); trackCv.width=W*dpr; trackCv.height=H*dpr;
const tctx=trackCv.getContext('2d'); tctx.scale(dpr,dpr);
const maskCv=document.createElement('canvas'); maskCv.width=W; maskCv.height=H; // logical res
const mctx=maskCv.getContext('2d',{willReadFrequently:true});

const TOTAL_LEVELS=12;
const START_R=26, END_R=26, CP_R=15;

// ---------- level path generation ----------
// ---- path primitives ----
function densify(A,step){
  const P=[{x:A[0].x,y:A[0].y}];
  for(let i=1;i<A.length;i++){ const a=A[i-1],b=A[i];
    const d=Math.hypot(b.x-a.x,b.y-a.y), n=Math.max(1,Math.round(d/step));
    for(let j=1;j<=n;j++) P.push({x:a.x+(b.x-a.x)*j/n, y:a.y+(b.y-a.y)*j/n}); }
  return P;
}
function arcSeg(P,cx,cy,r,a0,a1,step){
  const n=Math.max(2,Math.round(Math.abs(a1-a0)*r/step));
  for(let i=1;i<=n;i++){ const a=a0+(a1-a0)*i/n; P.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}); }
}
// ---- shape generators (each returns a dense centreline polyline) ----
function shapeSerpentineH(b,rows){
  const A=[], sp=(b.y1-b.y0)/(rows-1), rad=sp/2, xl=b.x0+rad, xr=b.x1-rad;
  for(let r=0;r<rows;r++){
    const y=b.y0+sp*r, ltr=r%2===0, xs=ltr?xl:xr, xe=ltr?xr:xl;
    if(r===0)A.push({x:xs,y}); A.push({x:xe,y});
    if(r<rows-1){ if(ltr)arcSeg(A,xe,y+rad,rad,-Math.PI/2,Math.PI/2,7);
                  else   arcSeg(A,xe,y+rad,rad,-Math.PI/2,-Math.PI*1.5,7); }
  } return densify(A,7);
}
function shapeSerpentineV(b,cols){
  const A=[], sp=(b.x1-b.x0)/(cols-1), rad=sp/2, yt=b.y0+rad, yb=b.y1-rad;
  for(let c=0;c<cols;c++){
    const x=b.x0+sp*c, ttb=c%2===0, ys=ttb?yt:yb, ye=ttb?yb:yt;
    if(c===0)A.push({x,y:ys}); A.push({x,y:ye});
    if(c<cols-1){ if(ttb)arcSeg(A,x+rad,yb,rad,Math.PI,0,7);
                  else    arcSeg(A,x+rad,yt,rad,Math.PI,2*Math.PI,7); }
  } return densify(A,7);
}
function shapeZigzag(b,peaks){
  const A=[]; for(let i=0;i<=peaks;i++) A.push({x:b.x0+(b.x1-b.x0)*i/peaks, y:(i%2===0)?b.y0:b.y1});
  return densify(A,7);
}
function shapeZigzagV(b,peaks){
  const A=[]; for(let i=0;i<=peaks;i++) A.push({x:(i%2===0)?b.x0:b.x1, y:b.y0+(b.y1-b.y0)*i/peaks});
  return densify(A,7);
}
function shapeSquare(b,cycles){
  const A=[{x:b.x0,y:b.y0}]; let cx=b.x0,cy=b.y0; const n=cycles*2, sx=(b.x1-b.x0)/n;
  for(let i=0;i<n;i++){ cx+=sx; A.push({x:cx,y:cy}); cy=(cy===b.y0)?b.y1:b.y0; A.push({x:cx,y:cy}); }
  return densify(A,7);
}
function shapeSquareV(b,cycles){
  const A=[{x:b.x0,y:b.y0}]; let cx=b.x0,cy=b.y0; const n=cycles*2, sy=(b.y1-b.y0)/n;
  for(let i=0;i<n;i++){ cy+=sy; A.push({x:cx,y:cy}); cx=(cx===b.x0)?b.x1:b.x0; A.push({x:cx,y:cy}); }
  return densify(A,7);
}
function shapeStaircase(b,steps){
  const A=[{x:b.x0,y:b.y0}]; const sx=(b.x1-b.x0)/steps, sy=(b.y1-b.y0)/steps; let x=b.x0,y=b.y0;
  for(let i=0;i<steps;i++){ x+=sx; A.push({x,y}); y+=sy; A.push({x,y}); }
  return densify(A,7);
}
function shapeSawtooth(b,teeth){
  const A=[{x:b.x0,y:b.y1}]; const sx=(b.x1-b.x0)/teeth;
  for(let i=0;i<teeth;i++){ const xb=b.x0+sx*(i+1); A.push({x:xb,y:b.y0}); A.push({x:xb,y:b.y1}); }
  return densify(A,7);
}
function shapeSpiral(b,ringGap){
  let l=b.x0,r=b.x1,t=b.y0,bm=b.y1; const A=[{x:l,y:t}]; let g=0;
  while(r-l>ringGap*1.5 && bm-t>ringGap*1.5 && g++<80){
    A.push({x:r,y:t}); A.push({x:r,y:bm}); A.push({x:l,y:bm}); A.push({x:l,y:t+ringGap});
    l+=ringGap; t+=ringGap; r-=ringGap; bm-=ringGap; A.push({x:l,y:t});
  } return densify(A,7);
}

function genLevel(n){ // n:1..12 — each level a distinct track shape
  const idx=n-1, mX=60, mY=60;
  const b={x0:mX, x1:W-mX, y0:mY, y1:H-mY};
  const width=Math.max(16, 40 - idx*1.8);   // corridor narrows with level
  const SAFE=width+22;                       // min spacing between parallel passes
  const maxRows=Math.max(2,Math.floor((b.y1-b.y0)/SAFE)+1);
  const maxCols=Math.max(2,Math.floor((b.x1-b.x0)/SAFE)+1);
  const maxPk =Math.max(3,Math.floor(2*(b.x1-b.x0)/SAFE));
  const maxPkV=Math.max(3,Math.floor(2*(b.y1-b.y0)/SAFE));
  const maxCyc=Math.max(2,Math.floor((b.x1-b.x0)/(2*SAFE)));
  const maxCycV=Math.max(2,Math.floor((b.y1-b.y0)/(2*SAFE)));
  let pts;
  switch(n){
    case 1:  pts=shapeSerpentineH(b, Math.min(3,maxRows)); break;  // 蛇形
    case 2:  pts=shapeZigzag(b, Math.min(5,maxPk)); break;          // 尖鋸齒
    case 3:  pts=shapeSquare(b, Math.min(3,maxCyc)); break;         // 方波
    case 4:  pts=shapeSerpentineV(b, Math.min(3,maxCols)); break;   // 垂直蛇形
    case 5:  pts=shapeStaircase(b, 6); break;                       // 階梯
    case 6:  pts=shapeSpiral(b, SAFE); break;                       // 漩渦
    case 7:  pts=shapeSawtooth(b, Math.min(5,maxPk)); break;        // 鋸齒坡
    case 8:  pts=shapeZigzagV(b, Math.min(6,maxPkV)); break;        // 垂直鋸齒
    case 9:  pts=shapeSquare(b, Math.min(5,maxCyc)); break;         // 細方波
    case 10: pts=shapeSerpentineH(b, Math.min(6,maxRows)); break;   // 密蛇形
    case 11: pts=shapeSquareV(b, Math.min(5,maxCycV)); break;       // 垂直方波
    default: pts=shapeZigzag(b, Math.min(9,maxPk)); break;          // 密尖鋸齒
  }
  const cps=[]; const nCp=Math.min(6, 1+Math.floor(idx/1.6));
  for(let k=1;k<=nCp;k++){ const i=Math.round(pts.length*k/(nCp+1)); cps.push({x:pts[i].x,y:pts[i].y}); }
  return {pts, cps, width};
}

// smoothed path stroking (quadratic through midpoints)
function tracePath(c, pts){
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const last=pts[pts.length-1];
  c.lineTo(last.x, last.y);
}

// ---------- render static layer + mask ----------
function buildLevel(L){
  // ---- mask (safe = opaque) ----
  mctx.clearRect(0,0,W,H);
  mctx.lineCap='round'; mctx.lineJoin='round';
  mctx.strokeStyle='#fff'; mctx.lineWidth=L.width;
  tracePath(mctx, L.pts); mctx.stroke();
  mctx.fillStyle='#fff';
  const s=L.pts[0], e=L.pts[L.pts.length-1];
  mctx.beginPath(); mctx.arc(s.x,s.y,START_R,0,7); mctx.fill();
  mctx.beginPath(); mctx.arc(e.x,e.y,END_R,0,7); mctx.fill();

  // ---- visual track ----
  tctx.clearRect(0,0,W,H);
  // grid background
  tctx.save();
  tctx.strokeStyle='rgba(70,110,200,.08)'; tctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){tctx.beginPath();tctx.moveTo(x,0);tctx.lineTo(x,H);tctx.stroke();}
  for(let y=0;y<=H;y+=40){tctx.beginPath();tctx.moveTo(0,y);tctx.lineTo(W,y);tctx.stroke();}
  tctx.restore();

  tctx.lineCap='round'; tctx.lineJoin='round';
  // outer danger edge (red rim glow)
  tctx.save();
  tctx.shadowColor='rgba(255,59,92,.0)';
  tracePath(tctx,L.pts);
  tctx.strokeStyle='rgba(255,80,110,.18)'; tctx.lineWidth=L.width+16; tctx.stroke();
  tctx.restore();
  // neon glow tube
  tctx.save();
  tctx.shadowColor='rgba(25,224,255,.9)'; tctx.shadowBlur=22;
  tracePath(tctx,L.pts);
  tctx.strokeStyle='rgba(25,224,255,.85)'; tctx.lineWidth=L.width; tctx.stroke();
  tctx.restore();
  // inner dark channel
  tracePath(tctx,L.pts);
  tctx.strokeStyle='rgba(8,16,34,.92)'; tctx.lineWidth=Math.max(4,L.width-12); tctx.stroke();
  // center dashed line
  tctx.save();
  tctx.setLineDash([10,12]);
  tracePath(tctx,L.pts);
  tctx.strokeStyle='rgba(123,92,255,.5)'; tctx.lineWidth=2; tctx.stroke();
  tctx.restore();

  // start zone
  tctx.save();
  tctx.shadowColor=getC('--green'); tctx.shadowBlur=18;
  tctx.fillStyle=getC('--green');
  tctx.beginPath(); tctx.arc(s.x,s.y,START_R,0,7); tctx.fill();
  tctx.restore();
  tctx.fillStyle='#042'; tctx.font='bold 20px system-ui'; tctx.textAlign='center'; tctx.textBaseline='middle';
  tctx.fillText('▶', s.x, s.y);
  // end zone
  tctx.save();
  tctx.shadowColor=getC('--gold'); tctx.shadowBlur=18;
  tctx.fillStyle=getC('--gold');
  tctx.beginPath(); tctx.arc(e.x,e.y,END_R,0,7); tctx.fill();
  tctx.restore();
  tctx.fillStyle='#330'; tctx.fillText('⚑', e.x, e.y);
  // checkpoints
  L.cps.forEach(cp=>{
    tctx.save();
    tctx.shadowColor=getC('--neon2'); tctx.shadowBlur=12;
    tctx.strokeStyle=getC('--neon2'); tctx.lineWidth=3;
    tctx.beginPath(); tctx.arc(cp.x,cp.y,CP_R,0,7); tctx.stroke();
    tctx.restore();
  });
}
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

// ---------- audio ----------
let AC=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function buzz(){
  const a=audio(); if(!a)return; const t=a.currentTime;
  // sawtooth gritty + noise
  const o=a.createOscillator(), g=a.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(90,t); o.frequency.linearRampToValueAtTime(55,t+.25);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.3);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.32);
  const buf=a.createBuffer(1,a.sampleRate*0.2,a.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const ns=a.createBufferSource(); ns.buffer=buf; const ng=a.createGain(); ng.gain.value=.25;
  ns.connect(ng); ng.connect(a.destination); ns.start(t);
}
function tone(freq,dur,when,type='sine',vol=.3){
  const a=audio(); if(!a)return; const t=a.currentTime+when;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,i*.1,'triangle',.35)); }

// ---------- looping BGM (synth) ----------
let bgmOn=false, bgmGain=null, bgmTimer=null, bgmStep=0, bgmNext=0;
const STEP_DUR=0.19;
// Am - F - C - G  (4 steps each = 16-step loop)
const CHORDS=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
const BASS=[110,87.31,65.41,98];
const ARP=[0,1,2,1];
function bgmNote(freq,t,dur,type,vol){
  const a=audio(); if(!a||!bgmGain)return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t+dur+.02);
}
function bgmScheduler(){
  if(!bgmOn)return; const a=audio(); if(!a)return;
  while(bgmNext < a.currentTime+0.2){
    const ci=Math.floor(bgmStep/4)%4;
    if(bgmStep%4===0) bgmNote(BASS[ci], bgmNext, .42, 'triangle', .55);
    bgmNote(CHORDS[ci][ARP[bgmStep%4]], bgmNext, .22, 'sine', .32);
    if(bgmStep%2===0) bgmNote(CHORDS[ci][2]*2, bgmNext, .12, 'square', .06); // sparkle
    bgmNext += STEP_DUR; bgmStep=(bgmStep+1)%16;
  }
  bgmTimer=setTimeout(bgmScheduler, 45);
}
function startBGM(){
  const a=audio(); if(!a)return; bgmOn=true;
  bgmGain=a.createGain(); bgmGain.gain.value=.35; bgmGain.connect(a.destination);
  bgmStep=0; bgmNext=a.currentTime+0.08; bgmScheduler();
}
function stopBGM(){
  bgmOn=false; if(bgmTimer)clearTimeout(bgmTimer);
  const a=audio(); if(a&&bgmGain){ try{bgmGain.gain.setTargetAtTime(0,a.currentTime,.05);}catch(e){} }
}

// ---------- pointer ----------
function toLogical(e){
  const r=cv.getBoundingClientRect();
  let x=(e.clientX-r.left)/r.width*W;
  let y=(e.clientY-r.top)/r.height*H;
  if(e.pointerType==='touch') y-=70;           // offset cursor above finger
  return {x,y};
}
function maskAlpha(x,y){
  if(x<0||y<0||x>=W||y>=H) return 0;
  return mctx.getImageData(x|0,y|0,1,1).data[3];
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
// position at fraction t (0..1) along a polyline by cumulative length
function posAlong(pts,t){
  let total=0; const seg=[];
  for(let i=1;i<pts.length;i++){ const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); seg.push(d); total+=d; }
  let target=t*total, acc=0;
  for(let i=1;i<pts.length;i++){
    if(acc+seg[i-1]>=target){ const f=seg[i-1]?(target-acc)/seg[i-1]:0;
      return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*f, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*f}; }
    acc+=seg[i-1];
  }
  return {x:pts[pts.length-1].x, y:pts[pts.length-1].y};
}
let demoT=0, demoDir=1, demoZapAt=0.5, demoZapped=false;

cv.addEventListener('pointerdown',e=>{
  audio(); pointerType=e.pointerType||'mouse'; e.preventDefault();
  const p=toLogical(e);
  if(!overlay.classList.contains('hidden')) return;
  if(state==='armed'){
    if(dist(p,armPoint) < Math.max(40,L.width)){
      cur=p; prev={...p};
      state='playing'; running=true;
      if(armPoint.x===L.pts[0].x && armPoint.y===L.pts[0].y) elapsed=0; // fresh start resets timer
    }
  }
});
cv.addEventListener('pointermove',e=>{
  if(state!=='playing') return; e.preventDefault();
  const p=toLogical(e);
  // sample along the move segment to prevent jumping walls
  if(prev){
    const steps=Math.max(1, Math.ceil(dist(prev,p)/(L.width*0.35)));
    for(let i=1;i<=steps;i++){
      const sx=prev.x+(p.x-prev.x)*i/steps, sy=prev.y+(p.y-prev.y)*i/steps;
      if(maskAlpha(sx,sy)===0){ electrocute({x:sx,y:sy}); return; }
    }
  }
  cur=p; prev={...p};
  // checkpoints
  L.cps.forEach((cp,i)=>{ if(!cpsReached[i] && dist(cur,cp)<CP_R+4){ cpsReached[i]=true; lastCp={...cp}; blip(); }});
  // win
  if(dist(cur,L.pts[L.pts.length-1])<END_R){ doWin(); }
});
function endHold(){ if(state==='playing'){ // lifted finger/mouse mid-track -> back to last checkpoint
  state='armed'; armPoint={...lastCp}; cur={...lastCp}; prev=null; running=false; }
}
cv.addEventListener('pointerup',e=>{e.preventDefault(); endHold();});
cv.addEventListener('pointercancel',()=>endHold());

function electrocute(at){

  for(let i=0;i<18;i++){const a=Math.random()*7,s=2+Math.random()*4;
    sparks.push({x:at.x,y:at.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1});}

}

// ---------- main loop ----------
function loop(ts){
  const dt=lastT?(ts-lastT)/1000:0; lastT=ts;

  // cover screen: auto-playing demo (with dramatic zap)
  if(state==='cover'){
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(trackCv,0,0,W,H);
    demoT += dt*0.15;
    // dramatic touch: deviate off-track once per lap → spark + red flash → restart
    if(!demoZapped && demoT>=demoZapAt){
      demoZapped=true; flash=1;
      const zp=posAlong(L.pts,demoZapAt);
      for(let i=0;i<22;i++){ const a=Math.random()*7, s=2+Math.random()*4;
        sparks.push({x:zp.x,y:zp.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1}); }
      demoT=0;                                   // zap → back to start
    }
    if(demoT>=1){ demoT=0; demoZapped=false; demoZapAt=0.35+Math.random()*0.45; }
    const tNow=Math.min(1,demoT);
    const p=posAlong(L.pts,tNow), pa=posAlong(L.pts,Math.min(1,tNow+0.012));
    const ang=Math.atan2(pa.y-p.y,pa.x-p.x)+Math.PI/2, wob=4*Math.sin(ts/110);
    const px=p.x+Math.cos(ang)*wob, py=p.y+Math.sin(ang)*wob;  // hand-controlled wobble
    for(let k=7;k>=1;k--){ const tp=posAlong(L.pts,Math.max(0,tNow-k*0.016));
      ctx.save(); ctx.globalAlpha=.06*k; ctx.fillStyle=getC('--neon'); ctx.shadowColor=getC('--neon'); ctx.shadowBlur=14;
      ctx.beginPath(); ctx.arc(tp.x,tp.y,9,0,7); ctx.fill(); ctx.restore(); }
    ctx.save(); ctx.shadowColor=getC('--neon'); ctx.shadowBlur=26; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(px,py,8,0,7); ctx.fill();
    ctx.strokeStyle=getC('--neon'); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(px,py,15,0,7); ctx.stroke();
    ctx.restore();
    // sparks
    sparks.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; s.vy+=.15; s.life-=.04; });
    sparks=sparks.filter(s=>s.life>0);
    sparks.forEach(s=>{ ctx.save(); ctx.globalAlpha=Math.max(0,s.life);
      ctx.fillStyle=getC('--gold'); ctx.shadowColor=getC('--gold'); ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(s.x,s.y,2.5,0,7); ctx.fill(); ctx.restore(); });
    if(flash>0){ ctx.save(); ctx.globalAlpha=flash*0.5; ctx.fillStyle=getC('--red');
      ctx.fillRect(0,0,W,H); ctx.restore(); flash-=0.04; }
    requestAnimationFrame(loop); return;
  }

  if(running && state==='playing') elapsed+=dt;
  document.getElementById('hTime').textContent=elapsed.toFixed(1)+'″';

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(trackCv,0,0,W,H);

  // armed: pulse the arm point
  if(state==='armed'){
    const ps=(Math.sin(ts/200)+1)/2;
    ctx.save(); ctx.globalAlpha=.5+ps*.5;
    ctx.strokeStyle=getC('--green'); ctx.lineWidth=3; ctx.shadowColor=getC('--green'); ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(armPoint.x,armPoint.y, 18+ps*10, 0,7); ctx.stroke();
    ctx.restore();
  }

  // player cursor
  if(state==='playing'||state==='armed'){
    const r=Math.max(6, (L?L.width:30)/2-4);
    ctx.save();
    ctx.shadowColor=state==='playing'?getC('--neon'):getC('--green'); ctx.shadowBlur=20;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(cur.x,cur.y,r*0.55,0,7); ctx.fill();
    ctx.strokeStyle=ctx.shadowColor; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cur.x,cur.y,r,0,7); ctx.stroke();
    ctx.restore();
    if(pointerType==='touch' && state==='playing'){ // show finger link line
      ctx.save(); ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.setLineDash([4,6]);
      ctx.beginPath(); ctx.moveTo(cur.x,cur.y); ctx.lineTo(cur.x,cur.y+70); ctx.stroke(); ctx.restore();
    }
  }

  // sparks
  sparks.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; s.vy+=.15; s.life-=.04; });
  sparks=sparks.filter(s=>s.life>0);
  sparks.forEach(s=>{ ctx.save(); ctx.globalAlpha=Math.max(0,s.life);
    ctx.fillStyle=getC('--gold'); ctx.shadowColor=getC('--gold'); ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(s.x,s.y,2.5,0,7); ctx.fill(); ctx.restore(); });

  // red flash
  if(flash>0){ ctx.save(); ctx.globalAlpha=flash*0.5; ctx.fillStyle=getC('--red');
    ctx.fillRect(0,0,W,H); ctx.restore(); flash-=0.04; }

  requestAnimationFrame(loop);
}

function stopLabBuzz(){
  if(!labBuzzOsc)return; const a=audio(), o=labBuzzOsc, g=labBuzzGain;
  if(a&&g) g.gain.setTargetAtTime(0,a.currentTime,0.03);
  labBuzzOsc=null; labBuzzGain=null; setTimeout(()=>{try{o.stop();}catch(e){}},150);
}
function renderLab(){
  if(!eduMode) return;
  const lab=document.getElementById('lab'); if(!lab) return;
  const conducting = swOn && curMat && curMat.c;
  const closed = conducting || labForce;
  lab.classList.toggle('closed',closed); lab.classList.toggle('lit',closed);
  if(conducting) startLabBuzz(); else stopLabBuzz();   // buzzer sounds only when truly closed
  const lev=document.getElementById('swLever');
  if(swOn){ lev.setAttribute('x2','480'); lev.setAttribute('y2','110'); }
  else    { lev.setAttribute('x2','452'); lev.setAttribute('y2','116'); }
  document.getElementById('swChip').textContent = swOn?'目前：接通 ✓':'目前：斷開 ⨉';
  const mg=document.getElementById('matG');
  if(curMat){ mg.style.display='';
    document.getElementById('matRect').setAttribute('fill', curMat.c?'rgba(57,255,158,.9)':'rgba(255,160,60,.85)');
    document.getElementById('matText').textContent=curMat.n; }
  else mg.style.display='none';
  const badge=document.getElementById('labBadge'), why=document.getElementById('labWhy');
  if(labForce){ badge.className='on'; badge.textContent='通路（電流流通！）';
    why.textContent='遊戲中「圈」碰到了軌道，電路被接通 → 電流流過，這就是觸電的原因！'; return; }
  let st,txt;
  if(!swOn){ st=false; txt='開關是斷開的 → 電路有缺口，電流無法流動，燈泡不亮、蜂鳴器不響。先把開關按成「接通」。'; }
  else if(!curMat){ st=false; txt='缺口沒有放任何東西 → 斷路，燈泡不亮、蜂鳴器不響。試著放入一個材料。'; }
  else if(curMat.c){ st=true; txt='「'+curMat.n+'」是導體，把缺口接通了 → 通路！電流流動、燈泡亮起、蜂鳴器「嗶——」響起。'; }
  else { st=false; txt='「'+curMat.n+'」是絕緣體，電流無法通過 → 斷路，燈泡不亮、蜂鳴器不響。'; }
  badge.className=st?'on':'off';
  badge.textContent=st?'通路（電流流通！）':'斷路（電流不通）';
  why.textContent=txt;
}
function labFlash(){
  if(!eduMode) return; labForce=true; renderLab();
  if(labTimer)clearTimeout(labTimer); labTimer=setTimeout(()=>{labForce=false;renderLab();},900);
}
function initLab(){
  buildMatChips();
  const sw=document.getElementById('swGroup'), swChip=document.getElementById('swChip');
  if(sw && !sw.dataset.done){ sw.dataset.done='1'; sw.addEventListener('click',toggleSwitch); }
  if(swChip && !swChip.dataset.done){ swChip.dataset.done='1'; swChip.addEventListener('click',toggleSwitch); }
  renderLab();
}

// ---------- quiz (education mode, shown on level clear) ----------
const QUIZ=[
  {q:'碰到光軌會觸電，是因為電路形成了什麼？',o:['通路（完整電路）','斷路（有缺口）'],c:0,e:'圈碰到軌道讓電流有完整路徑→通路，電流流通才會觸電。'},
  {q:'手把外層常包塑膠，塑膠是？',o:['導體','絕緣體'],c:1,e:'塑膠是絕緣體，電流不易通過，握著才不會被電到。'},
  {q:'金屬軌道和金屬圈屬於？',o:['導體','絕緣體'],c:0,e:'金屬是導體，容易讓電流通過。'},
  {q:'電流要能流動，電路必須是？',o:['斷路','通路'],c:1,e:'只有通路（完整迴路）電流才能流動。'},
  {q:'下列何者電流「無法」流動？',o:['通路','斷路'],c:1,e:'斷路有缺口，電流無法形成迴路。'},
  {q:'橡皮、玻璃、乾木頭大多是？',o:['絕緣體','導體'],c:0,e:'它們不易導電，是絕緣體。'},
  {q:'為什麼維修電器前要先拔插頭？',o:['讓電路變成斷路','讓電路變成通路'],c:0,e:'拔插頭造成斷路，沒有電流流過才安全。'},
  {q:'人體流汗時比較容易導電，因為汗水讓人體更像？',o:['絕緣體','導體'],c:1,e:'潮濕讓人體更易導電，更危險，所以濕手別碰電器。'},
];
function showQuiz(idx, onDone){
  const item=QUIZ[idx%QUIZ.length];
  const box=document.getElementById('ovQuiz'); box.innerHTML='';
  const q=document.createElement('div'); q.className='q'; q.textContent='🧠 '+item.q; box.appendChild(q);
  const exp=document.createElement('div'); exp.className='exp';
  const btns=[];
  item.o.forEach((txt,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=txt;
    b.onclick=()=>{
      btns.forEach(x=>x.disabled=true);
      if(i===item.c){ b.classList.add('right'); tone(880,.12,0,'square',.25); }
      else{ b.classList.add('wrong'); btns[item.c].classList.add('right'); buzz(); }
      exp.textContent='💡 '+item.e;
      ovBtn.style.display=''; ovBtn.onclick=()=>{ audio(); box.innerHTML=''; onDone(); ovBtn.onclick=null; };
    };
    btns.push(b); box.appendChild(b);
  });
  box.appendChild(exp);
  ovBtn.style.display='none'; // hide until answered
}

function updateCoverStats(){
  let cleared=0, sum=0;
  for(let i=1;i<=TOTAL_LEVELS;i++){ const b=getBest(i); if(b!=null){ cleared++; sum+=b; } }
  const el=document.getElementById('coverStats');
  if(cleared===0){ el.textContent=''; return; }
  el.textContent = cleared===TOTAL_LEVELS
    ? '🏆 全破關！總計 '+sum.toFixed(1)+'″'
    : '🏆 已破關 '+cleared+' / '+TOTAL_LEVELS+' 關';
}

renderLevels(); if(eduMode) initLab(); updateCoverStats();
requestAnimationFrame(loop);
